<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <title>Gastronomía Wonka</title>

    <meta
        name="description"
        content="Experiencia inmersiva de gastronomía inspirada en Willy Wonka">

    <!-- ==================== A-FRAME ==================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- Controles del video -->
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/play-on-click.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/hide-on-play.js"></script>

    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@gh-pages/examples/js/remix-dropdown.js"></script>




   <a-scene


        <!-- ================================================= -->
        <!-- RECURSOS -->
        <!-- ================================================= -->

        <a-assets>


            <!-- ==================== VIDEO 360 ==================== -->

            <video
                id="video"
                preload="auto"
                src="video/video360.mp4"
                loop
                crossorigin="anonymous">
            </video>


            <!-- ==================== MODELO 3D ==================== -->

            <a-asset-item

                id="puesto-wonka"

                src="modelos/PUESTO_WONKA_3D_FINAL_.glb">

            </a-asset-item>


        <!-- ================================================= -->
        <!-- CONTROLES VR -->
        <!-- ================================================= -->

        <a-entity

            id="leftHand"

            laser-controls="hand: left"

            raycaster="
                objects: .raycastable;
            ">

        </a-entity>



        <a-entity

            id="rightHand"

            laser-controls="hand: right"

            raycaster="
                objects: .raycastable;
            "

            line="
                color: #118A7E;
            ">

        </a-entity>


    </a-scene>

</body>

</html>
