<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <title>Gastronomía Wonka</title>

    <meta
        name="description"
        content="Experiencia inmersiva de gastronomía inspirada en Willy Wonka">

    <!-- ==================== A-FRAME ==================== -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- ================================================= -->
    <!-- SISTEMA DE INFOGRAFÍAS -->
    <!-- ================================================= -->

    <script>

        AFRAME.registerComponent('infografia-ui', {

            init: function () {

                /* =================================================
                   BOTONES
                ================================================= */

                const elinkaButton =
                    document.querySelector('#elinkaButton');

                const tostaoButton =
                    document.querySelector('#tostaoButton');

                const nuevaButton =
                    document.querySelector('#nuevaButton');


                /* =================================================
                   PANEL
                ================================================= */

                const infoPanel =
                    document.querySelector('#infoPanel');

                const infoImage =
                    document.querySelector('#infoImage');

                const infoTitle =
                    document.querySelector('#infoTitle');

                const closeButton =
                    document.querySelector('#closeButton');

                const panelBackground =
                    document.querySelector('#panelBackground');


                /* =================================================
                   IMÁGENES
                ================================================= */

                const imagenes = {

                    elinka: document.querySelector('#elinka'),

                    tostao: document.querySelector('#tostao'),

                    nueva: document.querySelector('#nueva')

                };


                /* =================================================
                   DATOS
                ================================================= */

                const infografias = {

                    elinka: {

                        imagen: '#elinka',

                        titulo:
                            'DULCES DE MENTA · ELLINIKA'

                    },

                    tostao: {

                        imagen: '#tostao',

                        titulo:
                            'DULCES DE CAFÉ · TOSTAO'

                    },

                    nueva: {

                        imagen: '#nueva',

                        titulo:
                            'GALLETAS DE LA SUERTE · NUEVA FELICIDAD'

                    }

                };


                /* =================================================
                   ABRIR INFOGRAFÍA
                ================================================= */

                function abrirInfografia(nombre) {

                    const datos = infografias[nombre];

                    const imagen = imagenes[nombre];


                    /* ---------------------------------------------
                       CAMBIAR IMAGEN
                    --------------------------------------------- */

                    infoImage.setAttribute(
                        'material',
                        'src',
                        datos.imagen
                    );


                    /* ---------------------------------------------
                       CAMBIAR TÍTULO
                    --------------------------------------------- */

                    infoTitle.setAttribute(
                        'text',
                        'value',
                        datos.titulo
                    );


                    /* ---------------------------------------------
                       CALCULAR PROPORCIÓN REAL
                    --------------------------------------------- */

                    if (
                        imagen &&
                        imagen.naturalWidth &&
                        imagen.naturalHeight
                    ) {

                        const aspectRatio =
                            imagen.naturalWidth /
                            imagen.naturalHeight;


                        /* -----------------------------------------
                           ALTURA FIJA
                        ----------------------------------------- */

                        const altura = 2.7;

                        const ancho =
                            altura * aspectRatio;


                        /* -----------------------------------------
                           CAMBIAR TAMAÑO DE LA INFOGRAFÍA
                        ----------------------------------------- */

                        infoImage.setAttribute(
                            'geometry',
                            {
                                primitive: 'plane',
                                width: ancho,
                                height: altura
                            }
                        );


                        /* -----------------------------------------
                           CAMBIAR TAMAÑO DEL FONDO
                        ----------------------------------------- */

                        panelBackground.setAttribute(
                            'geometry',
                            {
                                primitive: 'plane',
                                width: ancho + 0.45,
                                height: altura + 0.8
                            }
                        );


                        /* -----------------------------------------
                           POSICIÓN DEL TÍTULO
                        ----------------------------------------- */

                        infoTitle.setAttribute(
                            'position',
                            `0 ${-(altura / 2 + 0.28)} 0.04`
                        );


                        /* -----------------------------------------
                           POSICIÓN DEL BOTÓN X
                        ----------------------------------------- */

                        closeButton.setAttribute(
                            'position',
                            `${(ancho / 2) - 0.02} ${(altura / 2) + 0.25} 0.05`
                        );

                    }


                    /* ---------------------------------------------
                       MOSTRAR PANEL
                    --------------------------------------------- */

                    infoPanel.setAttribute(
                        'visible',
                        'true'
                    );

                }


                /* =================================================
                   BOTÓN ELLINIKA
                ================================================= */

                elinkaButton.addEventListener(
                    'click',
                    function () {

                        abrirInfografia('elinka');

                    }
                );


                /* =================================================
                   BOTÓN TOSTAO
                ================================================= */

                tostaoButton.addEventListener(
                    'click',
                    function () {

                        abrirInfografia('tostao');

                    }
                );


                /* =================================================
                   BOTÓN NUEVA FELICIDAD
                ================================================= */

                nuevaButton.addEventListener(
                    'click',
                    function () {

                        abrirInfografia('nueva');

                    }
                );


                /* =================================================
                   CERRAR PANEL
                ================================================= */

                closeButton.addEventListener(
                    'click',
                    function () {

                        infoPanel.setAttribute(
                            'visible',
                            'false'
                        );

                    }
                );

            }

        });

    </script>

</head>


<body>

    <a-scene

        infografia-ui

        cursor="rayOrigin: mouse; fuse: false"

        raycaster="objects: .raycastable">


        <!-- ================================================= -->
        <!-- RECURSOS -->
        <!-- ================================================= -->

        <a-assets>


            <!-- ==================== VIDEO 360 ==================== -->

            <video

                id="video"

                preload="auto"

                src="video/video360.mp4"

                autoplay

                loop

                crossorigin="anonymous">

            </video>


            <!-- ==================== MODELO 3D ==================== -->

            <a-asset-item

                id="puesto-wonka"

                src="modelos/PUESTO_WONKA_3D_FINAL_.glb">

            </a-asset-item>


            <!-- ==================== ELLINIKA ==================== -->

            <img

                id="elinka"

                src="infografias/INFOGRAFIA ELINKA_.png"

                crossorigin="anonymous">


            <!-- ==================== TOSTAO ==================== -->

            <img

                id="tostao"

                src="infografias/INFOGRAFIA TOSTAO_.png"

                crossorigin="anonymous">


            <!-- ==================== NUEVA FELICIDAD ==================== -->

            <img

                id="nueva"

                src="infografias/INFOGRAFIA NUEVA_FELICIDAD_.png"

                crossorigin="anonymous">


        </a-assets>



        <!-- ================================================= -->
        <!-- VIDEO 360 -->
        <!-- ================================================= -->

        <a-videosphere

            id="videoSphere"

            rotation="0 -90 0"

            src="#video">

        </a-videosphere>



        <!-- ================================================= -->
        <!-- PUESTO WONKA 3D -->
        <!-- ================================================= -->

        <a-entity

            gltf-model="#puesto-wonka"

            position="0 0 -3"

            rotation="0 0 0"

            scale="1 1 1">

        </a-entity>



        <!-- ================================================= -->
        <!-- MENÚ DE INFOGRAFÍAS -->
        <!-- ================================================= -->

        <a-entity

            id="ui"

            position="0 1.6 -3">


            <!-- ================================================= -->
            <!-- TÍTULO -->
            <!-- ================================================= -->

            <a-text

                value="SABORES DE LA FÁBRICA"

                align="center"

                width="5"

                color="white"

                position="0 1.3 0">

            </a-text>



            <!-- ================================================= -->
            <!-- ELLINIKA -->
            <!-- ================================================= -->

            <a-entity

                id="elinkaButton"

                class="raycastable"


                geometry="
                    primitive: plane;
                    width: 1.4;
                    height: 1.9;
                "


                material="
                    shader: flat;
                    src: #elinka;
                "


                position="-2 0 -0.35"


                rotation="0 -50 0"


                animation__mouseenter="
                    property: scale;
                    to: 1.08 1.08 1.08;
                    dur: 200;
                    startEvents: mouseenter;
                "


                animation__mouseleave="
                    property: scale;
                    to: 1 1 1;
                    dur: 200;
                    startEvents: mouseleave;
                ">

            </a-entity>



            <!-- ================================================= -->
            <!-- TOSTAO -->
            <!-- ================================================= -->

            <a-entity

                id="tostaoButton"

                class="raycastable"


                geometry="
                    primitive: plane;
                    width: 1.4;
                    height: 1.9;
                "


                material="
                    shader: flat;
                    src: #tostao;
                "


                position="0 0 -0.35"


                rotation="0 -50 0"


                animation__mouseenter="
                    property: scale;
                    to: 1.08 1.08 1.08;
                    dur: 200;
                    startEvents: mouseenter;
                "


                animation__mouseleave="
                    property: scale;
                    to: 1 1 1;
                    dur: 200;
                    startEvents: mouseleave;
                ">

            </a-entity>



            <!-- ================================================= -->
            <!-- NUEVA FELICIDAD -->
            <!-- ================================================= -->

            <a-entity

                id="nuevaButton"

                class="raycastable"


                geometry="
                    primitive: plane;
                    width: 1.4;
                    height: 1.9;
                "


                material="
                    shader: flat;
                    src: #nueva;
                "


                position="2 0 -0.35"


                rotation="0 -50 0"


                animation__mouseenter="
                    property: scale;
                    to: 1.08 1.08 1.08;
                    dur: 200;
                    startEvents: mouseenter;
                "


                animation__mouseleave="
                    property: scale;
                    to: 1 1 1;
                    dur: 200;
                    startEvents: mouseleave;
                ">

            </a-entity>


        </a-entity>



        <!-- ================================================= -->
        <!-- PANEL GRANDE DE INFOGRAFÍA -->
        <!-- ================================================= -->

        <a-entity

            id="infoPanel"

            visible="false"

            position="0 1.6 -2">


            <!-- ================================================= -->
            <!-- FONDO -->
            <!-- ================================================= -->

            <a-plane

                id="panelBackground"

                width="3"

                height="3.5"

                material="

                    color: #171717;

                    shader: flat;

                    opacity: 0.97;

                ">

            </a-plane>



            <!-- ================================================= -->
            <!-- IMAGEN -->
            <!-- ================================================= -->

            <a-plane

                id="infoImage"

                position="0 0 0.03"

                geometry="

                    primitive: plane;

                    width: 2;

                    height: 2.7;

                "

                material="

                    shader: flat;

                    src: #elinka;

                ">

            </a-plane>



            <!-- ================================================= -->
            <!-- TÍTULO -->
            <!-- ================================================= -->

            <a-text

                id="infoTitle"

                value="INFOGRAFÍA"

                align="center"

                width="3"

                color="white"

                position="0 -1.7 0.04">

            </a-text>



            <!-- ================================================= -->
            <!-- BOTÓN CERRAR -->
            <!-- ================================================= -->

            <a-entity

                id="closeButton"

                class="raycastable"


                geometry="

                    primitive: circle;

                    radius: 0.18;

                "


                material="

                    color: #B83232;

                    shader: flat;

                "


                position="1.2 1.5 0.05">


                <a-text

                    value="X"

                    align="center"

                    width="2"

                    color="white"

                    position="0 0 0.01">

                </a-text>


            </a-entity>


        </a-entity>



        <!-- ================================================= -->
        <!-- CÁMARA -->
        <!-- ================================================= -->

        <a-camera

            position="0 1.6 0">

        </a-camera>



        <!-- ================================================= -->
        <!-- CONTROL IZQUIERDO -->
        <!-- ================================================= -->

        <a-entity

            id="leftHand"

            laser-controls="hand: left"

            raycaster="

                objects: .raycastable;

            ">

        </a-entity>



        <!-- ================================================= -->
        <!-- CONTROL DERECHO -->
        <!-- ================================================= -->

        <a-entity

            id="rightHand"

            laser-controls="hand: right"

            raycaster="

                objects: .raycastable;

            "

            line="

                color: #118A7E;

            ">

        </a-entity>


    </a-scene>

</body>

</html>
