<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">

    <title>Fábrica de Chocolate - Wonka</title>
    <meta name="description" content="Experiencia inmersiva de la fábrica de chocolate de Willy Wonka">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- Controles del video -->
    <script src="scripts/play-on-click.js"></script>
    <script src="scripts/hide-on-play.js"></script>

    <!-- ========================================= -->
    <!-- COMPONENTE PARA ABRIR/CERRAR INFOGRAFÍAS -->
    <!-- ========================================= -->
    <script>

        AFRAME.registerComponent('infografia-ui', {

            init: function () {

                this.buttons = [
                    document.querySelector('#elinkaButton'),
                    document.querySelector('#tostaoButton'),
                    document.querySelector('#nuevaButton')
                ];

                this.infoPanel = document.querySelector('#infoPanel');
                this.infoImage = document.querySelector('#infoImage');
                this.infoTitle = document.querySelector('#infoTitle');
                this.closeButton = document.querySelector('#closeButton');

                this.data = [
                    {
                        image: '#elinka',
                        title: 'DULCES DE MENTA · ELLINIKA'
                    },
                    {
                        image: '#tostao',
                        title: 'DULCES DE CAFÉ · TOSTAO'
                    },
                    {
                        image: '#nueva',
                        title: 'GALLETAS DE LA SUERTE · NUEVA FELICIDAD'
                    }
                ];

                this.buttons.forEach((button, index) => {

                    button.addEventListener('click', () => {
                        this.open(index);
                    });

                });

                this.closeButton.addEventListener('click', () => {
                    this.close();
                });

            },

            open: function (index) {

                this.infoImage.setAttribute(
                    'material',
                    'src: ' + this.data[index].image
                );

                this.infoTitle.setAttribute(
                    'text',
                    'value: ' + this.data[index].title
                );

                this.infoPanel.setAttribute('visible', true);

            },

            close: function () {

                this.infoPanel.setAttribute('visible', false);

            }

        });

    </script>

</head>


<body>

    <a-scene
        infografia-ui
        background="color: #111"
        cursor="rayOrigin: mouse; fuse: false"
        raycaster="objects: .raycastable">


        <!-- ========================================= -->
        <!-- RECURSOS -->
        <!-- ========================================= -->

        <a-assets>

            <!-- VIDEO 360 -->
            <video
                id="video"
                preload="auto"
                src="video/video360.mp4"
                autoplay
                loop
                crossorigin="anonymous">
            </video>


            <!-- MODELO 3D -->
            <a-asset-item
                id="puesto-wonka"
                src="modelos/PUESTO_WONKA_3D_FINAL_.glb">
            </a-asset-item>


            <!-- INFOGRAFÍAS -->

            <img
                id="elinka"
                src="infografias/INFOGRAFIA ELINKA_.png"
                crossorigin="anonymous">

            <img
                id="tostao"
                src="infografias/INFOGRAFIA TOSTAO_.png"
                crossorigin="anonymous">

            <img
                id="nueva"
                src="infografias/INFOGRAFIA NUEVA_FELICIDAD_.png"
                crossorigin="anonymous">

        </a-assets>


        <!-- ========================================= -->
        <!-- VIDEO 360 -->
        <!-- ========================================= -->

        <a-videosphere
            rotation="0 -90 0"
            src="#video"
            visible="false"
            play-on-click>
        </a-videosphere>


        <!-- ========================================= -->
        <!-- PUESTO WONKA 3D -->
        <!-- ========================================= -->

        <a-entity
            gltf-model="#puesto-wonka"
            position="0 0 -3"
            rotation="0 0 0"
            scale="1 1 1">
        </a-entity>


        <!-- ========================================= -->
        <!-- MENÚ DE INFOGRAFÍAS -->
        <!-- ========================================= -->

        <a-entity
            id="ui"
            position="0 1.7 -2.7">

            <!-- TÍTULO -->
            <a-entity
                position="0 0.8 0"
                text="
                    value: SABORES DE LA FÁBRICA;
                    align: center;
                    width: 5;
                    color: white;
                ">
            </a-entity>


            <!-- =============================== -->
            <!-- INFOGRAFÍA ELLINIKA -->
            <!-- =============================== -->

            <a-entity
                id="elinkaButton"
                class="raycastable"
                geometry="primitive: plane; width: 1.1; height: 1.55"
                material="
                    src: #elinka;
                    shader: flat;
                "
                position="-1.2 0 0"
                animation__mouseenter="
                    property: scale;
                    to: 1.1 1.1 1.1;
                    dur: 200;
                    startEvents: mouseenter;
                "
                animation__mouseleave="
                    property: scale;
                    to: 1 1 1;
                    dur: 200;
                    startEvents: mouseleave;
                ">
            </a-entity>


            <!-- =============================== -->
            <!-- INFOGRAFÍA TOSTAO -->
            <!-- =============================== -->

            <a-entity
                id="tostaoButton"
                class="raycastable"
                geometry="primitive: plane; width: 1.1; height: 1.55"
                material="
                    src: #tostao;
                    shader: flat;
                "
                position="0 0 0"
                animation__mouseenter="
                    property: scale;
                    to: 1.1 1.1 1.1;
                    dur: 200;
                    startEvents: mouseenter;
                "
                animation__mouseleave="
                    property: scale;
                    to: 1 1 1;
                    dur: 200;
                    startEvents: mouseleave;
                ">
            </a-entity>


            <!-- =============================== -->
            <!-- INFOGRAFÍA NUEVA FELICIDAD -->
            <!-- =============================== -->

            <a-entity
                id="nuevaButton"
                class="raycastable"
                geometry="primitive: plane; width: 1.1; height: 1.55"
                material="
                    src: #nueva;
                    shader: flat;
                "
                position="1.2 0 0"
                animation__mouseenter="
                    property: scale;
                    to: 1.1 1.1 1.1;
                    dur: 200;
                    startEvents: mouseenter;
                "
                animation__mouseleave="
                    property: scale;
                    to: 1 1 1;
                    dur: 200;
                    startEvents: mouseleave;
                ">
            </a-entity>

        </a-entity>


        <!-- ========================================= -->
        <!-- PANEL GRANDE DE INFOGRAFÍA -->
        <!-- ========================================= -->

        <a-entity
            id="infoPanel"
            visible="false"
            position="0 1.6 -2.2">


            <!-- FONDO -->
            <a-plane
                width="2.9"
                height="2.2"
                color="#222"
                opacity="0.96">
            </a-plane>


            <!-- IMAGEN -->
            <a-plane
                id="infoImage"
                position="0 0 0.02"
                width="2.3"
                height="1.65"
                material="
                    shader: flat;
                    src: #elinka;
                ">
            </a-plane>


            <!-- TÍTULO -->
            <a-entity
                id="infoTitle"
                position="0 -1 0.03"
                text="
                    value: INFOGRAFÍA;
                    align: center;
                    width: 3;
                    color: white;
                ">
            </a-entity>


            <!-- BOTÓN CERRAR -->
            <a-entity
                id="closeButton"
                class="raycastable"
                position="1.15 0.85 0.05"
                geometry="
                    primitive: plane;
                    width: 0.35;
                    height: 0.35;
                "
                material="
                    color: #C0392B;
                    shader: flat;
                "
                text="
                    value: X;
                    align: center;
                    width: 2;
                    color: white;
                ">
            </a-entity>

        </a-entity>


        <!-- ========================================= -->
        <!-- CÁMARA -->
        <!-- ========================================= -->

        <a-camera
            position="0 1.6 0">

            <!-- MENSAJE INICIAL -->

            <a-entity
                position="0 0 -1.5"
                text="
                    align: center;
                    width: 6;
                    wrapCount: 100;
                    color: white;
                    value: Click o toca para comenzar;
                "
                hide-on-play="#video">
            </a-entity>

        </a-camera>


        <!-- ========================================= -->
        <!-- CONTROLADORES VR -->
        <!-- ========================================= -->

        <a-entity
            id="leftHand"
            laser-controls="hand: left"
            raycaster="objects: .raycastable">
        </a-entity>

        <a-entity
            id="rightHand"
            laser-controls="hand: right"
            raycaster="objects: .raycastable"
            line="color: #118A7E">
        </a-entity>


    </a-scene>

</body>

</html>
