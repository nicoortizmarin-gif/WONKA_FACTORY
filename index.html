<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">

    <title>Gastronomía Wonka</title>

    <meta
        name="description"
        content="Experiencia inmersiva de gastronomía inspirada en Willy Wonka"
    >

    <!-- ================================================= -->
    <!-- A-FRAME -->
    <!-- ================================================= -->

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>


    <!-- ================================================= -->
    <!-- SISTEMA DE INFOGRAFÍAS -->
    <!-- ================================================= -->

    <script>

        AFRAME.registerComponent('infografia-ui', {

            init: function () {

                /* =================================================
                   MODELO REAL DE LA ESCENA
                ================================================= */

                const puesto =
                    document.querySelector('#puesto-wonka');


                /* =================================================
                   BOTONES
                ================================================= */

                const elinkaButton =
                    document.querySelector('#elinkaButton');

                const tostaoButton =
                    document.querySelector('#tostaoButton');

                const nuevaButton =
                    document.querySelector('#nuevaButton');


                /* =================================================
                   PANEL
                ================================================= */

                const infoPanel =
                    document.querySelector('#infoPanel');

                const infoImage =
                    document.querySelector('#infoImage');

                const infoTitle =
                    document.querySelector('#infoTitle');

                const closeButton =
                    document.querySelector('#closeButton');

                const panelBackground =
                    document.querySelector('#panelBackground');


                /* =================================================
                   IMÁGENES
                ================================================= */

                const imagenes = {

                    elinka:
                        document.querySelector('#elinka'),

                    tostao:
                        document.querySelector('#tostao'),

                    nueva:
                        document.querySelector('#nueva')

                };


                /* =================================================
                   DATOS
                ================================================= */

                const infografias = {

                    elinka: {
                        imagen: '#elinka',
                        titulo: 'DULCES DE MENTA · ELLINIKA'
                    },

                    tostao: {
                        imagen: '#tostao',
                        titulo: 'DULCES DE CAFÉ · TOSTAO'
                    },

                    nueva: {
                        imagen: '#nueva',
                        titulo: 'GALLETAS DE LA SUERTE · NUEVA FELICIDAD'
                    }

                };


                /* =================================================
                   CUANDO EL GLB TERMINA DE CARGAR
                ================================================= */

                puesto.addEventListener('model-loaded', function () {

                    console.log('==============================');
                    console.log('GLB CARGADO');
                    console.log('==============================');


                    const modelo =
                        puesto.getObject3D('mesh');


                    if (!modelo) {

                        console.error(
                            'No se encontró el mesh del modelo'
                        );

                        return;

                    }


                    /* =================================================
                       MOSTRAR TODOS LOS NOMBRES DEL GLB
                    ================================================= */

                    modelo.traverse(function (objeto) {

                        if (objeto.name) {

                            console.log(
                                'OBJETO GLB:',
                                objeto.name
                            );

                        }

                    });


                    /* =================================================
                       BUSCAR CARTELES
                    ================================================= */

                    const cartelElinka =
                        modelo.getObjectByName(
                            'CARTEL_ELINKA'
                        );

                    const cartelTostao =
                        modelo.getObjectByName(
                            'CARTEL_TOSTAO'
                        );

                    const cartelNueva =
                        modelo.getObjectByName(
                            'CARTEL_NUEVA_FELICIDAD'
                        );


                    console.log(
                        'CARTEL_ELINKA →',
                        cartelElinka
                    );

                    console.log(
                        'CARTEL_TOSTAO →',
                        cartelTostao
                    );

                    console.log(
                        'CARTEL_NUEVA_FELICIDAD →',
                        cartelNueva
                    );


                    /* =================================================
                       ELLINIKA
                    ================================================= */

                    if (cartelElinka) {

                        cartelElinka.add(
                            elinkaButton.object3D
                        );


                        elinkaButton.object3D.position.set(
                            0,
                            0,
                            0.02
                        );


                        elinkaButton.object3D.rotation.set(
                            0,
                            0,
                            0
                        );


                        elinkaButton.object3D.scale.set(
                            1,
                            1,
                            1
                        );

                    }


                    /* =================================================
                       TOSTAO
                    ================================================= */

                    if (cartelTostao) {

                        cartelTostao.add(
                            tostaoButton.object3D
                        );


                        tostaoButton.object3D.position.set(
                            0,
                            0,
                            0.02
                        );


                        tostaoButton.object3D.rotation.set(
                            0,
                            0,
                            0
                        );


                        tostaoButton.object3D.scale.set(
                            1,
                            1,
                            1
                        );

                    }


                    /* =================================================
                       NUEVA FELICIDAD
                    ================================================= */

                    if (cartelNueva) {

                        cartelNueva.add(
                            nuevaButton.object3D
                        );


                        nuevaButton.object3D.position.set(
                            0,
                            0,
                            0.02
                        );


                        nuevaButton.object3D.rotation.set(
                            0,
                            0,
                            0
                        );


                        nuevaButton.object3D.scale.set(
                            1,
                            1,
                            1
                        );

                    }

                });


                /* =================================================
                   ABRIR INFOGRAFÍA
                ================================================= */

                function abrirInfografia(nombre) {

                    const datos =
                        infografias[nombre];

                    const imagen =
                        imagenes[nombre];


                    infoImage.setAttribute(
                        'material',
                        'src',
                        datos.imagen
                    );


                    infoTitle.setAttribute(
                        'text',
                        'value',
                        datos.titulo
                    );


                    /* =================================================
                       MANTENER PROPORCIÓN
                    ================================================= */

                    if (
                        imagen &&
                        imagen.naturalWidth &&
                        imagen.naturalHeight
                    ) {

                        const proporcion =
                            imagen.naturalWidth /
                            imagen.naturalHeight;


                        const altura = 2.7;

                        const ancho =
                            altura * proporcion;


                        infoImage.setAttribute(
                            'geometry',
                            {
                                primitive: 'plane',
                                width: ancho,
                                height: altura
                            }
                        );


                        panelBackground.setAttribute(
                            'geometry',
                            {
                                primitive: 'plane',
                                width: ancho + 0.45,
                                height: altura + 0.8
                            }
                        );


                        infoTitle.setAttribute(
                            'position',
                            `0 ${-(altura / 2 + 0.28)} 0.04`
                        );


                        closeButton.setAttribute(
                            'position',
                            `${(ancho / 2) - 0.02} ${(altura / 2) + 0.25} 0.05`
                        );

                    }


                    infoPanel.setAttribute(
                        'visible',
                        'true'
                    );

                }


                /* =================================================
                   BOTONES
                ================================================= */

                elinkaButton.addEventListener(
                    'click',
                    function () {
                        abrirInfografia('elinka');
                    }
                );


                tostaoButton.addEventListener(
                    'click',
                    function () {
                        abrirInfografia('tostao');
                    }
                );


                nuevaButton.addEventListener(
                    'click',
                    function () {
                        abrirInfografia('nueva');
                    }
                );


                /* =================================================
                   CERRAR
                ================================================= */

                closeButton.addEventListener(
                    'click',
                    function () {

                        infoPanel.setAttribute(
                            'visible',
                            'false'
                        );

                    }
                );

            }

        });

    </script>

</head>


<body>

    <a-scene

        infografia-ui

        cursor="rayOrigin: mouse; fuse: false"

        raycaster="objects: .raycastable"
    >


        <!-- ================================================= -->
        <!-- RECURSOS -->
        <!-- ================================================= -->

        <a-assets>


            <!-- VIDEO -->

            <video
                id="video"
                preload="auto"
                src="video/video360.mp4"
                autoplay
                loop
                crossorigin="anonymous">
            </video>


            <!-- GLB -->

            <!-- IMPORTANTE:
                 ESTE ID ES DISTINTO AL ID DEL MODELO -->

            <a-asset-item
                id="puestoAsset"
                src="modelos/PUESTO_WONKA_3D_FINAL_.glb">
            </a-asset-item>


            <!-- INFOGRAFÍA ELLINIKA -->

            <img
                id="elinka"
                src="infografias/INFOGRAFIA ELINKA_.png"
                crossorigin="anonymous">


            <!-- INFOGRAFÍA TOSTAO -->

            <img
                id="tostao"
                src="infografias/INFOGRAFIA TOSTAO_.png"
                crossorigin="anonymous">


            <!-- INFOGRAFÍA NUEVA -->

            <img
                id="nueva"
                src="infografias/INFOGRAFIA NUEVA_FELICIDAD_.png"
                crossorigin="anonymous">


        </a-assets>



        <!-- ================================================= -->
        <!-- VIDEO 360 -->
        <!-- ================================================= -->

        <a-videosphere

            id="videoSphere"

            rotation="0 -90 0"

            src="#video"
        >
        </a-videosphere>



        <!-- ================================================= -->
        <!-- MODELO 3D -->
        <!-- ================================================= -->

        <a-entity

            id="puesto-wonka"

            gltf-model="#puestoAsset"

            position="0 0 -3"

            rotation="0 0 0"

            scale="1 1 1"
        >
        </a-entity>



        <!-- ================================================= -->
        <!-- INFOGRAFÍA ELLINIKA -->
        <!-- ================================================= -->

        <a-entity

            id="elinkaButton"

            class="raycastable"

            geometry="
                primitive: plane;
                width: 1.25;
                height: 1.70;
            "

            material="
                shader: flat;
                src: #elinka;
                side: double;
            "
        >
        </a-entity>



        <!-- ================================================= -->
        <!-- INFOGRAFÍA TOSTAO -->
        <!-- ================================================= -->

        <a-entity

            id="tostaoButton"

            class="raycastable"

            geometry="
                primitive: plane;
                width: 1.25;
                height: 1.70;
            "

            material="
                shader: flat;
                src: #tostao;
                side: double;
            "
        >
        </a-entity>



        <!-- ================================================= -->
        <!-- INFOGRAFÍA NUEVA -->
        <!-- ================================================= -->

        <a-entity

            id="nuevaButton"

            class="raycastable"

            geometry="
                primitive: plane;
                width: 1.25;
                height: 1.70;
            "

            material="
                shader: flat;
                src: #nueva;
                side: double;
            "
        >
        </a-entity>



        <!-- ================================================= -->
        <!-- PANEL GRANDE -->
        <!-- ================================================= -->

        <a-entity

            id="infoPanel"

            visible="false"

            position="0 1.6 -2"
        >


            <a-plane

                id="panelBackground"

                geometry="
                    primitive: plane;
                    width: 3;
                    height: 3.5;
                "

                material="
                    color: #171717;
                    shader: flat;
                    opacity: 0.97;
                "
            >
            </a-plane>


            <a-plane

                id="infoImage"

                position="0 0 0.03"

                geometry="
                    primitive: plane;
                    width: 2;
                    height: 2.7;
                "

                material="
                    shader: flat;
                    src: #elinka;
                    side: double;
                "
            >
            </a-plane>


            <a-text

                id="infoTitle"

                value="INFOGRAFÍA"

                align="center"

                width="3"

                color="white"

                position="0 -1.7 0.04"
            >
            </a-text>


            <a-entity

                id="closeButton"

                class="raycastable"

                geometry="
                    primitive: circle;
                    radius: 0.18;
                "

                material="
                    color: #B83232;
                    shader: flat;
                "

                position="1.2 1.5 0.05"
            >

                <a-text

                    value="X"

                    align="center"

                    width="2"

                    color="white"

                    position="0 0 0.01"
                >
                </a-text>

            </a-entity>

        </a-entity>



        <!-- ================================================= -->
        <!-- CÁMARA -->
        <!-- ================================================= -->

        <a-camera
            position="0 1.6 0">
        </a-camera>



        <!-- ================================================= -->
        <!-- CONTROLES VR -->
        <!-- ================================================= -->

        <a-entity
            id="leftHand"
            laser-controls="hand: left"
            raycaster="objects: .raycastable">
        </a-entity>


        <a-entity
            id="rightHand"
            laser-controls="hand: right"
            raycaster="objects: .raycastable"
            line="color: #118A7E">
        </a-entity>


    </a-scene>

</body>

</html>
